---
openapi: 3.0.1
info:
  title: API V1
  version: v1
paths:
  "/api/v1/tags":
    get:
      summary: List tags
      tags:
      - Tags
      responses:
        '200':
          description: successful
    post:
      summary: Create tag
      tags:
      - Tags
      parameters: []
      responses:
        '201':
          description: tag created
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                tag:
                  type: object
                  properties:
                    name:
                      type: string
                  required:
                  - name
  "/api/v1/tags/{id}":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
    get:
      summary: Show tag
      tags:
      - Tags
      responses:
        '200':
          description: successful
    patch:
      summary: Update tag
      tags:
      - Tags
      parameters: []
      responses:
        '200':
          description: tag updated
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                tag:
                  type: object
                  properties:
                    name:
                      type: string
    delete:
      summary: Delete tag
      tags:
      - Tags
      responses:
        '204':
          description: tag deleted
  "/api/v1/tasks/{task_id}/occurrences/{occurrence_date}":
    patch:
      summary: Update occurrence
      tags:
      - Occurrences
      parameters:
      - name: task_id
        in: path
        required: true
        schema:
          type: integer
      - name: occurrence_date
        in: path
        format: date
        description: Occurrence date
        required: true
        schema:
          type: string
      responses:
        '200':
          description: successful
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum:
                  - pending
                  - completed
                  - cancelled
                overridden_due_date:
                  type: string
                  format: date-time
                detached:
                  type: boolean
                title_override:
                  type: string
                description_override:
                  type: string
  "/api/v1/tasks/{task_id}/tags":
    post:
      summary: Attach tag to task
      tags:
      - Task Tags
      parameters:
      - name: task_id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: successful
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                tag_id:
                  type: integer
              required:
              - tag_id
  "/api/v1/tasks/{task_id}/tags/{tag_id}":
    delete:
      summary: Remove tag from task
      tags:
      - Task Tags
      parameters:
      - name: task_id
        in: path
        required: true
        schema:
          type: integer
      - name: tag_id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: successful
  "/api/v1/tasks":
    get:
      summary: List tasks
      tags:
      - Tasks
      parameters:
      - name: status
        in: query
        required: false
        description: Filter by status
        schema:
          type: string
      - name: from
        in: query
        required: false
        description: Start due date
        schema:
          type: string
      - name: to
        in: query
        required: false
        description: End due date
        schema:
          type: string
      - name: page
        in: query
        required: false
        description: Pagination page
        schema:
          type: integer
      responses:
        '200':
          description: successful
    post:
      summary: Create task
      tags:
      - Tasks
      parameters: []
      responses:
        '201':
          description: task created
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                task:
                  type: object
                  properties:
                    title:
                      type: string
                    description:
                      type: string
                    status:
                      type: string
                      enum:
                      - pending
                      - completed
                      - cancelled
                    due_date:
                      type: string
                      format: date
                    recurrence_type:
                      type: string
                      enum:
                      - none
                      - daily
                      - monthly
                      - specific_dates
                      - even_days
                      - odd_days
                    interval_value:
                      type: integer
                    monthly_day:
                      type: integer
                    ends_at:
                      type: string
                      format: date
                    specific_dates:
                      type: array
                      items:
                        type: string
                        format: date
                  required:
                  - title
                  - due_date
  "/api/v1/tasks/{id}":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
    get:
      summary: Show task
      tags:
      - Tasks
      responses:
        '200':
          description: successful
    patch:
      summary: Update task
      tags:
      - Tasks
      parameters: []
      responses:
        '200':
          description: task updated
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                task:
                  type: object
                  properties:
                    title:
                      type: string
                    description:
                      type: string
                    status:
                      type: string
                      enum:
                      - pending
                      - completed
                      - cancelled
                    due_date:
                      type: string
                      format: date
                    recurrence_type:
                      type: string
                      enum:
                      - none
                      - daily
                      - monthly
                      - specific_dates
                      - even_days
                      - odd_days
                    interval_value:
                      type: integer
                    monthly_day:
                      type: integer
                    ends_at:
                      type: string
                      format: date
                    specific_dates:
                      type: array
                      items:
                        type: string
                        format: date
    delete:
      summary: Delete task
      tags:
      - Tasks
      responses:
        '204':
          description: task deleted
servers:
- url: http://{defaultHost}
  variables:
    defaultHost:
      default: localhost:3000
