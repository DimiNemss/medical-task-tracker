default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("DB_HOST", "localhost") %>
  port: <%= ENV.fetch("DB_PORT", 5432) %>
  username: <%= ENV.fetch("POSTGRES_USER", "postgres") %>
  password: <%= ENV.fetch("POSTGRES_PASSWORD", "postgres") %>

development:
  <<: *default
  database: medical_task_tracker_development

test:
  <<: *default
  database: medical_task_tracker_test

production:
  <<: *default
  database: medical_task_tracker_production
  username: medical_task_tracker
  password: <%= ENV["MEDICAL_TASK_TRACKER_DATABASE_PASSWORD"] %>